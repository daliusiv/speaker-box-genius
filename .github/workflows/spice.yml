name: SPICE check

# Every SPICE validation case in ngspice, against mna.py (solver agreement) and the engine.
# docs/validation.md "Independent circuit check (SPICE)".
on:
  pull_request:
    paths:
      - "packages/engine/**"
      - ".github/workflows/spice.yml"
  push:
    branches: [main]
    paths:
      - "packages/engine/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ngspice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ngspice
        timeout-minutes: 15
        # The runner's package mirrors sometimes fail to resolve for a few minutes: retry.
        run: |
          for i in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ngspice; then break; fi
            [ "$i" = 5 ] && exit 1
            echo "apt failed (try $i), retrying in $((i * 20)) s"; sleep $((i * 20))
          done
          ngspice --version | head -3
      - name: ngspice vs mna.py vs engine
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning packages/engine/validation/spice-cli.ts ngspice
