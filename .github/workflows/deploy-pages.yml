name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Public repo only. The private dev repo can't use Pages on a free plan; it deploys a
    # preview to Cloudflare instead (preview.yml), with the same build steps.
    if: ${{ github.event.repository.private != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Add `cache: pnpm` here once pnpm-lock.yaml is committed.

      - run: pnpm install --no-frozen-lockfile

      - name: Validate and bundle driver database
        run: pnpm validate:db && pnpm build:db

      - name: Build web app
        run: pnpm --filter @sbg/web build

      # Driver share cards from the last deploy: only changed ones are drawn again (site/cardCache.ts).
      # A new key each run saves the updated set; restore-keys picks up the latest one.
      - name: Restore share cards
        uses: actions/cache@v4
        with:
          path: .cache/cards
          key: share-cards-${{ github.run_id }}
          restore-keys: share-cards-

      # Each page's content hash and lastmod date from the last deploy (site/sitemap.ts), so a
      # sitemap date only moves when that page really changed.
      - name: Restore sitemap dates
        uses: actions/cache@v4
        with:
          path: .cache/sitemap
          key: sitemap-lastmod-${{ github.run_id }}
          restore-keys: sitemap-lastmod-

      - name: Build guide pages, sitemaps and robots.txt
        run: pnpm build:site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
