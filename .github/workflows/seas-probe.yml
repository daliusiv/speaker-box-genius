name: SEAS probe (one-off, scratch branch only)

# Saves robots.txt and a small sample of seas.no pages and datasheets to this
# branch so the SEAS importer can be written against the real site. Never merged.
on:
  push:
    branches: [probe/seas]
    paths: [".github/probe/**", ".github/workflows/seas-probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # seas.no doesn't send its intermediate certificate. Fetch it from the
      # address in the server certificate (AIA "CA Issuers") and trust it
      # alongside the system roots; verification stays on.
      - name: Complete seas.no's certificate chain
        run: |
          echo | openssl s_client -connect www.seas.no:443 -servername www.seas.no 2>/dev/null | openssl x509 > leaf.pem
          url=$(openssl x509 -in leaf.pem -noout -ext authorityInfoAccess | grep -o 'CA Issuers - URI:.*' | sed 's/CA Issuers - URI://')
          echo "intermediate: $url"
          curl -fsSL "$url" -o inter.crt
          (openssl x509 -inform DER -in inter.crt 2>/dev/null || openssl x509 -in inter.crt) > inter.pem
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > bundle.pem
          openssl verify -untrusted inter.pem -CAfile /etc/ssl/certs/ca-certificates.crt leaf.pem
          echo "SSL_CERT_FILE=$PWD/bundle.pem" >> "$GITHUB_ENV"
      - name: Probe seas.no
        run: python3 .github/probe/seas_probe.py
      - name: Save the snapshot to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-out
          git commit -m "SEAS probe snapshot" || echo "nothing to commit"
          git push
