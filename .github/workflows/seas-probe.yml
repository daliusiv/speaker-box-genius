name: SEAS trial import (scratch branch only)

# Runs the SEAS importer from PR #201 against the live site and saves what it
# wrote, plus its report, to this branch for review. Never merged.
on:
  push:
    branches: [probe/seas]
    paths: ["packages/db-tools/src/seas.ts", ".github/workflows/seas-probe.yml"]

permissions:
  contents: write

jobs:
  trial:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pdftotext
        run: command -v pdftotext || (sudo apt-get update -q && sudo apt-get install -yq poppler-utils)
      - name: Complete seas.no's certificate chain
        run: |
          echo | openssl s_client -connect www.seas.no:443 -servername www.seas.no 2>/dev/null | openssl x509 > leaf.pem
          url=$(openssl x509 -in leaf.pem -noout -ext authorityInfoAccess | grep -o 'CA Issuers - URI:.*' | sed 's/CA Issuers - URI://')
          curl -fsSL "$url" -o inter.crt
          (openssl x509 -inform DER -in inter.crt 2>/dev/null || openssl x509 -in inter.crt) > "$RUNNER_TEMP/seas-intermediate.pem"
          openssl verify -untrusted "$RUNNER_TEMP/seas-intermediate.pem" -CAfile /etc/ssl/certs/ca-certificates.crt leaf.pem
          rm leaf.pem inter.crt
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/seas-intermediate.pem" >> "$GITHUB_ENV"
      - name: Read seas.no
        run: SEAS_ONLY=573,636,595,592,559,611,568,587,643,575,614,113,114,115,571,634,632,604,608,609,576 SEAS_DUMP_DIR=seas-dump node --experimental-strip-types --disable-warning=ExperimentalWarning packages/db-tools/src/seas.ts
      - name: Check the database
        continue-on-error: true
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning packages/db-tools/src/validate.ts 2>&1 | tee validate.txt
      - name: Save the result to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in seas-dump seas-import-report.md validate.txt drivers/seas passive-radiators/seas; do [ -e "$p" ] && git add -f "$p"; done; true
          git commit -m "SEAS trial import result" || echo "nothing to commit"
          git push
