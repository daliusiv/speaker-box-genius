name: Import GLADEN drivers

# Reads the product pages on gladen.com (with Gladen Europe's permission, see
# docs/data-permissions.md) and opens a pull request with new and updated entries plus a
# report of anything adjusted or skipped (the missing or inconsistent values Gladen asked to
# hear about). Run it by hand when Gladen updates its range.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read gladen.com
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning packages/db-tools/src/gladen.ts

      - name: Check the database
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning packages/db-tools/src/validate.ts

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: db/gladen-import
          add-paths: |
            drivers/gladen/**
          commit-message: "Database: import GLADEN drivers from gladen.com (with permission)"
          title: "Database: GLADEN import"
          labels: database
          body-path: gladen-import-report.md
