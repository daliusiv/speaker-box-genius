name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Private dev repo: the self-hosted runner. The public mirror (this file is synced there)
    # stays on GitHub's runners, so fork PRs never run on our machine.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate driver database
        run: pnpm validate:db

      - name: Tests
        # Node's default is one file fewer than the cores; the files are independent, use them all.
        run: pnpm test --test-concurrency=$(nproc)

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Driver pages' share cards are drawn with Chrome at deploy; skip them here.
          SBG_CARDS: "0"
