name: Dayton probe (temporary)

# One-off check that daytonaudio.com is reachable from Actions and what its
# pages look like. Removed once the importer exists.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch samples
        run: |
          mkdir out && cd out
          UA="SpeakerBoxGenius-importer/0.1 (+https://github.com/daliusiv/speaker-box-genius)"
          get() { echo "== $1"; curl -sSL -A "$UA" -o "$2" -w "%{http_code} %{content_type} %{size_download}\n" "$1" || true; sleep 2; }
          get https://www.daytonaudio.com/robots.txt robots.txt
          get "https://www.daytonaudio.com/specs/specsheet.php?prod=295-464" specsheet-295-464.html
          get "https://www.daytonaudio.com/specs/specsheet.php?prod=295-467" specsheet-295-467.html
          get "https://www.daytonaudio.com/specs/specsheet.php?prod=295-502" specsheet-295-502.html
          get https://www.daytonaudio.com/product/121/rss315hf-4-12-reference-hf-subwoofer-4-ohm product-121.html
          get https://www.daytonaudio.com/category/121/subwoofers category-121.html
          get "https://www.daytonaudio.com/category/121/subwoofers?pagenum=2" category-121-p2.html
          get https://www.daytonaudio.com/ home.html
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: dayton-samples
          path: out
