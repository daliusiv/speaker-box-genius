name: SB Acoustics import on this branch (temporary)
on:
  push:
    branches: [sb-probe]
    paths: [".github/workflows/sb-probe.yml", "packages/db-tools/src/sb.ts"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read sbacoustics.com
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning packages/db-tools/src/sb.ts
      - name: Check the database
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning packages/db-tools/src/validate.ts
      - name: Commit the entries to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drivers/sb-acoustics passive-radiators/sb-acoustics sb-import-report.md
          git commit -m "Database: SB Acoustics drivers and passive radiators from sbacoustics.com (with permission)" || echo "nothing to commit"
          git push
