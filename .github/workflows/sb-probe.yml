name: SB Acoustics probe (temporary)
on:
  push:
    branches: [sb-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dry run of the importer
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning packages/db-tools/src/sb.ts --dry-run
