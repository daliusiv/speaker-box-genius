name: Site check (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://daliusiv.github.io/speaker-box-genius
          curl -sS $B/ | grep -E "manifest|icon|theme-color|assets/"
          for f in sw.js manifest.webmanifest icons/icon-192.png icons/icon-maskable-512.png db/index.json; do
            curl -sS -o /dev/null -w "%{http_code} %{content_type} $f\n" $B/$f
          done
