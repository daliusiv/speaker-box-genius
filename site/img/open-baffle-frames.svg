<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Flat board, U-frame and H-frame, seen from above</title>
  <desc id="d">Three open baffles seen from above, the listener at the top. Flat board: a plain panel. U-frame: the board at the front with side walls running back, open at the rear, so the back of the cone fires into a short duct. H-frame: the board half-way along the side walls, so both sides of the cone fire into a duct. The side walls lengthen the path round the frame, which gives more bass, and the duct adds a quarter-wave resonance.</desc>
  <rect width="1200" height="420" fill="#11141a"/>
  <text x="600" y="34" fill="#8b93a3" font-size="17" text-anchor="middle">listener ↑ · seen from above · orange: the path the rear wave takes to the front</text>
  <!-- flat -->
  <g transform="translate(200 0)">
    <text y="80" fill="#e6e8ee" font-size="22" font-weight="600" text-anchor="middle">Flat board</text>
    <rect x="-130" y="200" width="260" height="14" rx="3" fill="#4ed7e9" fill-opacity=".25" stroke="#4ed7e9" stroke-width="4"/>
    <path d="M-34 200 L-24 176 L24 176 L34 200" fill="#4ed7e9" fill-opacity=".15" stroke="#4ed7e9" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 240 C-120 250 -150 240 -146 207 C-143 175 -110 160 -50 150" fill="none" stroke="#fb923c" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
    <text y="320" fill="#8b93a3" font-size="17" text-anchor="middle">shortest path, least bass</text>
  </g>
  <!-- U -->
  <g transform="translate(600 0)">
    <text y="80" fill="#e6e8ee" font-size="22" font-weight="600" text-anchor="middle">U-frame</text>
    <path d="M-130 300 L-130 150 L130 150 L130 300" fill="none" stroke="#4ed7e9" stroke-width="8" stroke-linejoin="round"/>
    <rect x="-130" y="143" width="260" height="14" rx="3" fill="#4ed7e9" fill-opacity=".25" stroke="#4ed7e9" stroke-width="4"/>
    <path d="M-34 143 L-24 119 L24 119 L34 143" fill="#4ed7e9" fill-opacity=".15" stroke="#4ed7e9" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 170 L0 280" stroke="#fb923c" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
    <path d="M0 300 C-60 330 -150 340 -152 290 L-152 160 C-150 115 -110 100 -50 95" fill="none" stroke="#fb923c" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
    <text x="0" y="228" fill="#fb923c" font-size="15" text-anchor="middle" transform="rotate(-90 22 228)">duct</text>
    <path d="M150 150 L150 300 M144 150 L156 150 M144 300 L156 300" stroke="#8b93a3" stroke-width="3"/>
    <text x="162" y="231" fill="#8b93a3" font-size="16">depth</text>
    <text y="380" fill="#8b93a3" font-size="17" text-anchor="middle">back of the cone fires into a duct</text>
  </g>
  <!-- H -->
  <g transform="translate(1000 0)">
    <text y="80" fill="#e6e8ee" font-size="22" font-weight="600" text-anchor="middle">H-frame</text>
    <path d="M-130 120 L-130 320 M130 120 L130 320" fill="none" stroke="#4ed7e9" stroke-width="8" stroke-linecap="round"/>
    <rect x="-130" y="213" width="260" height="14" rx="3" fill="#4ed7e9" fill-opacity=".25" stroke="#4ed7e9" stroke-width="4"/>
    <path d="M-34 213 L-24 189 L24 189 L34 213" fill="#4ed7e9" fill-opacity=".15" stroke="#4ed7e9" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 240 L0 305" stroke="#fb923c" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
    <path d="M0 322 C-60 350 -150 355 -152 305 L-152 140 C-150 105 -110 95 -50 92" fill="none" stroke="#fb923c" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
    <text y="390" fill="#8b93a3" font-size="17" text-anchor="middle">both sides fire into a duct</text>
  </g>
</svg>
